# The StudyJit API and its Postgres database. Settings come from .env next to this file (copy .env.example);
# on the server the Publish API workflow writes it.
#
#   Production:            docker compose up -d --build
#   Local database only:   docker compose up -d db     (then run the API from the IDE / dotnet run)
#
# Its own project name, so it never touches the website's or admin site's containers (they share the server and
# --remove-orphans).
name: studyjit-api

services:
  api:
    build: .
    restart: unless-stopped
    # Plain HTTP on every interface; the reverse proxy terminates TLS in front of it.
    ports:
      - "${API_PORT:?API_PORT is not set}:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Database__MigrateOnStartup=true
      - Storage__Root=/shared-files
      # The proxy reaches the container through Docker's bridge network, so trust X-Forwarded-* from there;
      # otherwise every client shares the proxy's IP for rate limiting.
      - ReverseProxy__KnownNetworks=172.16.0.0/12
    volumes:
      - files:/shared-files

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Loopback only, so it's never reachable from the network: the API container uses the internal "db" host,
    # and a locally run API uses localhost.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  # Uploaded files and YouTube downloads.
  files:
