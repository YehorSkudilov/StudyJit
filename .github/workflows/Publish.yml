name: Publish

# Thin orchestrator - the actual deploys live in PublishApi.yml, PublishWeb.yml and PublishAdminWeb.yml, called here
# as reusable workflows so there's exactly one copy of each to maintain.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:

  # ==================================================
  # DEPLOY API
  # ==================================================
  deploy-api:
    uses: ./.github/workflows/PublishApi.yml
    secrets: inherit

  # ==================================================
  # DEPLOY WEBSITE
  # ==================================================
  deploy-web:
    uses: ./.github/workflows/PublishWeb.yml
    secrets: inherit

  # ==================================================
  # DEPLOY WEB ADMIN
  # ==================================================
  deploy-admin-web:
    uses: ./.github/workflows/PublishAdminWeb.yml
    secrets: inherit
