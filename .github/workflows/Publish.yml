name: Publish

# Thin orchestrator - the actual deploy lives in PublishWeb.yml, called here as a
# reusable workflow so there's exactly one copy of it to maintain.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:

  # ==================================================
  # DEPLOY WEBSITE
  # ==================================================
  deploy-web:
    uses: ./.github/workflows/PublishWeb.yml
    secrets: inherit
