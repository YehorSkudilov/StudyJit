# The web admin. Settings come from .env next to this file (see .env.example); on the server the Publish Admin Web
# workflow writes it.
#
#   docker compose up -d --build
#
# Its own project name, so it never touches the API's or the website's containers (they share the server and
# --remove-orphans).
name: studyjit-admin-web

services:
  admin-web:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    restart: unless-stopped
    # Plain HTTP on every interface; the reverse proxy terminates TLS in front of it.
    ports:
      - "${ADMIN_WEB_PORT:?ADMIN_WEB_PORT is not set}:80"
