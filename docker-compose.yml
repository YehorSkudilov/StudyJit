version: "3.9"

services:

  # 🌐 Next.js app
  app:
    build: .
    container_name: ${APP_NAME}
    restart: always
    ports:
      - "${APP_PORT}:3000"
    depends_on:
      - db
    environment:
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DB_HOST=${DB_HOST}
      - DB_USER=root
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    volumes:
      - db-files:/shared-files
    networks:
      - next-network

  # 🗄️ MySQL database
  db:
    image: mysql:8.0
    container_name: "${APP_NAME}-mysql"
    restart: always
    # ports:
    #   - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql
      - db-files:/var/lib/mysql-files
    networks:
      - next-network

  # 📘 Swagger UI
  swagger:
    image: swaggerapi/swagger-ui
    container_name: "${APP_NAME}-swagger"
    restart: always
    environment:
      - URL=https://studyjit.yehorskudilov.com/api/openapi
    volumes:
      - ./docs:/docs
    ports:
      - "${SWAGGER_PORT}:8080"
    networks:
      - next-network
    depends_on:
      - app

# ✅ Persistent volumes
volumes:
  mysql-data:
  db-files:

# ✅ Shared Docker network
networks:
  next-network:
